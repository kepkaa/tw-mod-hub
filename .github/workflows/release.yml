name: Release

# Запускается, когда ты пушишь тег вида v1.3.0 (его создаёт publish.bat).
# GitHub сам собирает установщик Kepka-Deck-Setup.exe и выкладывает его в Releases.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # версия приложения берётся из тега (v1.3.0 -> 1.3.0), чтобы не путаться
      - name: Set version from tag
        shell: pwsh
        run: npm version $env:GITHUB_REF_NAME.TrimStart('v') --no-git-tag-version --allow-same-version

      - run: npm install --no-audit --no-fund

      - name: Build and publish
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
